      let currentDecimalPlaces = Math.min(
        10,
        Math.max(getDecimalPlaces(entry.min), getDecimalPlaces(entry.max))
      );
      const currentStep = getNumberStep(currentDecimalPlaces);

      panelBody.innerHTML = `
        ${renderResultBox("抽取结果")}
        <div class="number-panel-grid">
          <div class="number-main">
            <div class="toolbar">
              <button class="primary" id="drawNumberBtn">开始抽取</button>
              <button class="primary" style="background: #16a34a;" id="saveNumberBtn">保存</button>
            </div>
            <div class="range-box">
              <label>在 <input type="number" id="minNumber" value="${escapeHtml(entry.min)}" step="${currentStep}" /> 和 <input type="number" id="maxNumber" value="${escapeHtml(entry.max)}" step="${currentStep}" /> 之间</label>
            </div>
          </div>
          <aside class="number-presets">
            <div class="number-presets-title">列表</div>
            <div class="number-preset-list" id="numberPresetList"></div>
          </aside>
        </div>
      `;

      const minInput = document.getElementById("minNumber");
      const maxInput = document.getElementById("maxNumber");
      let isManualNumberEdit = false;
      let isNumberStepChange = false;
      let deletingRangeIndex = null;

      minInput.removeAttribute("value");
      maxInput.removeAttribute("value");
      minInput.value = entry.min;
      maxInput.value = entry.max;
      formatNumberInputs(currentDecimalPlaces);

      function isCurrentRange(range) {
        return range.min === entry.min && range.max === entry.max;
      }

      function renderNumberPresets() {
        const presetList = document.getElementById("numberPresetList");
        if (!presetList) return;

        if (entry.ranges.length === 0) {
          presetList.innerHTML = '<div class="number-empty">暂无保存的列表</div>';
          return;
        }

        presetList.innerHTML = entry.ranges.map((range, index) => `
          <div class="number-preset-row">
            <button class="number-preset${isCurrentRange(range) ? " active" : ""}" data-index="${index}">
              ${escapeHtml(range.min)} 至 ${escapeHtml(range.max)}
            </button>
            <button class="number-preset-delete${deletingRangeIndex === index ? " confirming" : ""}" data-index="${index}" title="删除">
              ${deletingRangeIndex === index ? "确认删除" : "×"}
            </button>
          </div>
        `).join("");

        presetList.querySelectorAll(".number-preset").forEach(button => {
          button.addEventListener("click", () => {
            const range = entry.ranges[Number(button.dataset.index)];
            if (!range) return;

            deletingRangeIndex = null;
            entry.min = range.min;
            entry.max = range.max;
            minInput.value = range.min;
            maxInput.value = range.max;
            currentDecimalPlaces = Math.min(
              10,
              Math.max(getDecimalPlaces(range.min), getDecimalPlaces(range.max))
            );
            updateNumberInputSteps(currentDecimalPlaces);
            saveToStorage();
            renderNumberPresets();
          });
        });

        presetList.querySelectorAll(".number-preset-delete").forEach(button => {
          button.addEventListener("click", () => {
            const index = Number(button.dataset.index);
            if (deletingRangeIndex !== index) {
              deletingRangeIndex = index;
              renderNumberPresets();
              return;
            }

            entry.ranges.splice(index, 1);
            deletingRangeIndex = null;
            saveToStorage();
            renderNumberPresets();
          });
        });
      }

      function markTypingNumber(event) {
        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          isNumberStepChange = true;
          isManualNumberEdit = false;
          return;
        }

        if (event.key.length === 1 || event.key === "Backspace" || event.key === "Delete") {
          isManualNumberEdit = true;
        }
      }

      function markPointerStepChange(event) {
        const rect = event.currentTarget.getBoundingClientRect();
        if (event.clientX >= rect.right - 28) {
          isNumberStepChange = true;
          isManualNumberEdit = false;
        }
      }

      function handleNumberInput() {
        if (isNumberStepChange || !isManualNumberEdit) {
          formatNumberInputs(currentDecimalPlaces);
          requestAnimationFrame(() => {
            formatNumberInputs(currentDecimalPlaces);
          });
          isNumberStepChange = false;
        } else {
          currentDecimalPlaces = getNumberInputsDecimalPlaces();
          isManualNumberEdit = false;
        }

        updateNumberInputSteps(currentDecimalPlaces);
        const range = getNumberRange(currentDecimalPlaces);
        if (range) {
          deletingRangeIndex = null;
          saveNumberRange(entry, range);
          renderNumberPresets();
        }
      }

      function saveValidNumberRange() {
        if (isNumberStepChange) {
          formatNumberInputs(currentDecimalPlaces);
          isNumberStepChange = false;
        }

        const range = getNumberRange(currentDecimalPlaces);
        if (range) {
          deletingRangeIndex = null;
          saveNumberRange(entry, range);
          renderNumberPresets();
        }
      }

      updateNumberInputSteps(currentDecimalPlaces);
      minInput.addEventListener("mousedown", markPointerStepChange);
      maxInput.addEventListener("mousedown", markPointerStepChange);
      minInput.addEventListener("keydown", markTypingNumber);
      maxInput.addEventListener("keydown", markTypingNumber);
      minInput.addEventListener("wheel", () => { isNumberStepChange = true; });
      maxInput.addEventListener("wheel", () => { isNumberStepChange = true; });
      minInput.addEventListener("paste", () => { isManualNumberEdit = true; });
      maxInput.addEventListener("paste", () => { isManualNumberEdit = true; });
      minInput.addEventListener("drop", () => { isManualNumberEdit = true; });
      maxInput.addEventListener("drop", () => { isManualNumberEdit = true; });
      minInput.addEventListener("input", handleNumberInput);
      maxInput.addEventListener("input", handleNumberInput);
      minInput.addEventListener("change", saveValidNumberRange);
      maxInput.addEventListener("change", saveValidNumberRange);
      renderNumberPresets();

      document.getElementById("saveNumberBtn").addEventListener("click", () => {
        formatNumberInputs(currentDecimalPlaces);
        const range = getNumberRange(currentDecimalPlaces);
        if (!range) {
          setResult("请输入有效数字");
          return;
        }

        saveNumberRange(entry, range);
        deletingRangeIndex = null;
        const alreadySaved = entry.ranges.some(savedRange =>
          savedRange.min === range.minText && savedRange.max === range.maxText
        );
        if (!alreadySaved) {
          entry.ranges.push({ min: range.minText, max: range.maxText });
          saveToStorage();
        }
        renderNumberPresets();
        setResult(alreadySaved ? "该范围已保存" : "范围已保存");
      });

      document.getElementById("drawNumberBtn").addEventListener("click", () => {
        const range = getNumberRange(currentDecimalPlaces);

        if (!range) {
          setResult("请输入有效数字");
          return;
        }

        formatNumberInputs(currentDecimalPlaces);
        const formattedRange = getNumberRange(currentDecimalPlaces);
        if (!formattedRange) {
          setResult("请输入有效数字");
          return;
        }

        saveNumberRange(entry, formattedRange);
        let { min, max, decimalPlaces } = formattedRange;
        if (min > max) {
          [min, max] = [max, min];
        }

        setResult(randomNumberInRange(min, max, decimalPlaces));
      });
    }

    /**
     * 根据当前选中的模式渲染右侧面板内容。
     */
    function renderPanel() {
      const entry = DATA[currentIndex];

      if (!entry) {
        panelHeader.textContent = "当前内容";
        panelBody.innerHTML = '<div class="error">没有可用内容。</div>';
        return;
      }

      panelHeader.textContent = entry.title;

      if (entry.type === "list") {
        renderListPanel(entry);
        return;
      }

      if (entry.type === "groups") {
        renderGroupsPanel(entry);
        return;
      }

      if (entry.type === "number") {
        renderNumberPanel(entry);
        return;
      }

      panelBody.innerHTML = '<div class="error">格式不正确。</div>';
    }

    /**
     * 重新渲染导航与当前内容面板。
     */
    function render() {
      renderNav();
      renderPanel();
    }

    // 页面初始化入口
    loadFromStorage();
    render();
  </script>
</body>
</html>
