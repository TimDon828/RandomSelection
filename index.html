<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>随机抽取</title>
  <style>
    /* 主题颜色与变量定义 */
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    /* 全局盒模型设定，避免内边距与宽度冲突 */
    * {
      box-sizing: border-box;
    }

    /* 页面基础样式 */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* 主容器样式，限制最大宽度并居中显示 */
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    /* 主标题样式 */
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    /* 页面布局：左侧模式列表，右侧内容面板 */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      align-items: start;
    }

    /* 通用卡片样式 */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* 卡片头部样式 */
    .card-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }

    /* 卡片内容区内边距 */
    .card-body {
      padding: 16px;
    }

    /* 导航按钮样式 */
    .list-button {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 13px 16px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
    }

    .list-button:hover {
      background: #f9fafb;
    }

    .list-button.active {
      background: #eff6ff;
      color: var(--primary);
      font-weight: 700;
    }

    .list-button:last-child {
      border-bottom: 0;
    }

    /* 工具栏按钮布局 */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    /* 主要按钮样式 */
    button.primary {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
      background: var(--primary);
      color: white;
    }

    button.primary:hover {
      background: var(--primary-dark);
    }

    /* 列表内容标题样式 */
    .content-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    /* 列表项容器样式 */
    .items {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    /* 单个列表项样式 */
    .item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fafafa;
    }

    /* 抽取结果显示区 */
    .result {
      margin-bottom: 16px;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      background: #eff6ff;
      padding: 16px;
      min-height: 84px;
    }

    .result-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.4;
      word-break: break-word;
    }

    /* 数字范围输入区布局 */
    .range-box {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="number"] {
      width: 120px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      background: white;
    }

    /* 分组展示块间距 */
    .section-gap {
      margin-top: 16px;
    }

    /* 分组标题样式 */
    .small-title {
      font-weight: 800;
      margin-bottom: 10px;
    }

    /* 错误提示样式 */
    .error {
      color: var(--danger);
      font-weight: 700;
    }

    /* 编辑模式下的列表项样式 */
    .item.editable {
      display: flex;
      gap: 8px;
      align-items: center;
      background: white;
      border-color: var(--primary);
    }

    .item.editable input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
    }

    .item.editable button {
      border: 0;
      background: none;
      color: var(--danger);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 14px;
    }

    .item.editable button:hover {
      background: rgba(220, 38, 38, 0.1);
      border-radius: 4px;
    }

    .drag-handle {
      cursor: grab;
      color: var(--muted);
      font-size: 18px;
      padding: 4px 6px;
      flex-shrink: 0;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .item.dragging {
      opacity: 0.5;
      background: #f0f0f0;
    }

    .item.drag-over {
      border-top: 3px solid var(--primary);
      padding-top: 7px;
    }

    button.primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* 响应式布局：窄屏时改为单列 */
    @media (max-width: 760px) {
      .app {
        padding: 14px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .result-value {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>随机抽取</h1>

    <section class="layout">
      <!-- 左侧导航：用于选择抽取模式 -->
      <aside class="card">
        <div class="card-header">模式</div>
        <div id="listNav"></div>
      </aside>

      <!-- 右侧内容区域：根据当前模式动态渲染内容 -->
      <section class="card">
        <div class="card-header" id="panelHeader">当前内容</div>
        <div class="card-body" id="panelBody"></div>
      </section>
    </section>
  </main>

  <script>
    // 页面显示的抽取模式数据集，包含三种演示模式
    let DATA = [
      {
        type: "list",
        title: "列表抽取",
        items: [
          "是",
          "否"
        ]
      },
      {
        type: "number",
        title: "数字抽取",
        min: 1,
        max: 100
      },
      {
        type: "groups",
        title: "分组抽取",
        groups: {
          "学习": {
            "知识":[
              "数学",
              "语文",
              "英语",
              "历史",
              "地理",
              "生物",
              "化学",
              "物理",
              "政治"
            ],
            "技能":{
              "编程":[
                "Python",
                "JavaScript",
                "Java",
                "C++"
              ],
              "写作":[],
              "绘画":[]
            }
          },
          "娱乐": {
            "室内": [
              "玩游戏",
              "看视频",
              "读书"
            ],
            "室外": [
              "跑步",
              "登山",
              "骑车"
            ]
          },
          "创作": {
            "技术类": [
              "写程序",
              "搭建网站",
              "写文档"
            ],
            "艺术类": [
              "剪视频",
              "做音乐",
              "画画"
            ]
          }
        }
      }
    ];

    // 当前选中模式的索引，默认为第一个模式
    let currentIndex = 0;
    
    // 编辑模式状态
    let isEditingMode = false;
    let editingBackup = null;
    let draggedItem = null;

    // 缓存常用 DOM 元素引用，减少重复查询
    const listNav = document.getElementById("listNav");
    const panelHeader = document.getElementById("panelHeader");
    const panelBody = document.getElementById("panelBody");

    /**
     * 从 localStorage 读取并应用保存的数据
     */
    function loadFromStorage() {
      const saved = localStorage.getItem("randomSelectionData");
      if (saved) {
        try {
          const parsedData = JSON.parse(saved);
          // 只更新列表类型的数据
          for (let i = 0; i < DATA.length; i++) {
            if (DATA[i].type === "list" && parsedData[i]) {
              DATA[i].items = parsedData[i].items || DATA[i].items;
            }
          }
        } catch (e) {
          console.error("读取本地数据失败:", e);
        }
      }
    }

    /**
     * 保存当前数据到 localStorage
     */
    function saveToStorage() {
      try {
        localStorage.setItem("randomSelectionData", JSON.stringify(DATA));
      } catch (e) {
        console.error("保存数据失败:", e);
      }
    }

    /**
     * 生成闭区间随机整数。
     * @param {number} min 最小值
     * @param {number} max 最大值
     * @returns {number} 随机整数
     */
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /**
     * 从数组中随机取一个元素。
     * @param {Array} array 输入数组
     * @returns {*} 随机元素或 null
     */
    function pickOne(array) {
      if (!Array.isArray(array) || array.length === 0) return null;
      return array[randomInt(0, array.length - 1)];
    }

    /**
     * 对文本进行 HTML 转义，避免插入不安全内容。
     * @param {*} value 任意值
     * @returns {string} 转义后的字符串
     */
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /**
     * 递归渲染分组结构，支持多层嵌套。
     * @param {string} groupName 分组名称
     * @param {*} groupData 分组数据（数组或对象）
     * @param {number} depth 当前深度
     * @returns {string} HTML字符串
     */
    function renderGroup(groupName, groupData, depth = 0) {
      if (Array.isArray(groupData)) {
        // 渲染项目列表
        return `
          <div class="section-gap" style="margin-left: ${depth * 16}px;">
            <div class="small-title">${escapeHtml(groupName)} <span style="color: var(--muted); font-weight: 400;">(${groupData.length} 项)</span></div>
            <div class="items">
              ${groupData.map(item => `<div class="item">${escapeHtml(item)}</div>`).join("")}
            </div>
          </div>
        `;
      } else if (typeof groupData === 'object' && groupData !== null) {
        // 递归渲染子分组
        const subHtml = Object.entries(groupData).map(([subName, subData]) => renderGroup(subName, subData, depth + 1)).join("");
        return `
          <div class="section-gap" style="margin-left: ${depth * 16}px;">
            <div class="small-title">${escapeHtml(groupName)}</div>
            ${subHtml}
          </div>
        `;
      }
      return '';
    }

    /**
     * 从分组数据中随机选择一个项目，在同一级内等概率。
     * @param {*} groupData 分组数据
     * @returns {string} 选择结果或路径
     */
    function pickFromNestedGroup(groupData) {
      if (Array.isArray(groupData)) {
        // 直接从数组中选择
        return pickOne(groupData);
      } else if (typeof groupData === 'object' && groupData !== null) {
        // 从对象的键中随机选择一个
        const keys = Object.keys(groupData);
        if (keys.length === 0) return null;
        const selectedKey = pickOne(keys);
        const selectedValue = groupData[selectedKey];
        const childResult = pickFromNestedGroup(selectedValue);
        return childResult ? `${selectedKey} → ${childResult}` : selectedKey;
      }
      return null;
    }

    /**
     * 渲染左侧导航区域，每个按钮代表一种抽取模式。
     */
    function renderNav() {
      listNav.innerHTML = "";

      DATA.forEach((entry, index) => {
        const button = document.createElement("button");
        button.className = "list-button" + (index === currentIndex ? " active" : "");
        button.textContent = entry.title;
        button.addEventListener("click", () => {
          if (isEditingMode) return; // 编辑模式下不允许切换
          currentIndex = index;
          render();
        });
        listNav.appendChild(button);
      });
    }

    /**
     * 返回一个固定样式的结果展示区 HTML 模板。
     * @param {string} label 显示的标签文本
     * @returns {string} HTML 字符串
     */
    function renderResultBox(label = "抽取结果") {
      return `
        <div class="result">
          <div class="result-label">${escapeHtml(label)}</div>
          <div class="result-value" id="resultValue">尚未抽取</div>
        </div>
      `;
    }

    /**
     * 更新结果显示区域的文本。
     * @param {string} value 结果文本
     */
    function setResult(value) {
      const resultValue = document.getElementById("resultValue");
      if (resultValue) resultValue.textContent = value;
    }

    /**
     * 设置拖动功能
     */
    function setupDragAndDrop() {
      const itemsContainer = document.querySelector(".items");
      if (!itemsContainer) return;
      
      const items = itemsContainer.querySelectorAll(".item.editable");
      let draggingItem = null;
      let draggingItemIndex = -1;

      items.forEach((item, index) => {
        item.dataset.index = index;
        const dragHandle = item.querySelector(".drag-handle");

        dragHandle.addEventListener("mousedown", (e) => {
          e.preventDefault();
          draggingItem = item;
          draggingItemIndex = index;
          item.classList.add("dragging");

          function onMouseMove(moveEvent) {
            if (!draggingItem) return;

            const container = document.querySelector(".items");
            if (!container) return;
            
            const allItems = Array.from(container.querySelectorAll(".item.editable"));
            
            allItems.forEach((otherItem, idx) => {
              if (otherItem === draggingItem) return;
              
              const otherRect = otherItem.getBoundingClientRect();
              const midpoint = otherRect.top + otherRect.height / 2;
              
              // 根据鼠标位置显示插入位置提示
              if (moveEvent.clientY < midpoint) {
                otherItem.classList.add("drag-over");
              } else {
                otherItem.classList.remove("drag-over");
              }
            });
          }

          function onMouseUp(upEvent) {
            if (!draggingItem || draggingItemIndex === -1) return;

            const container = document.querySelector(".items");
            if (!container) {
              draggingItem.classList.remove("dragging");
              draggingItem = null;
              document.removeEventListener("mousemove", onMouseMove);
              document.removeEventListener("mouseup", onMouseUp);
              return;
            }

            const allItems = Array.from(container.querySelectorAll(".item.editable"));
            
            // 找到放置位置：基于 drag-over 标记的元素
            let targetIndex = -1;
            for (let i = 0; i < allItems.length; i++) {
              if (allItems[i].classList.contains("drag-over")) {
                targetIndex = i;
                break;
              }
            }

            // 如果没找到 drag-over，说明拖到了底部，用最后一个后面的位置
            if (targetIndex === -1) {
              targetIndex = allItems.length;
            }

            // 清除样式
            draggingItem.classList.remove("dragging");
            allItems.forEach(item => item.classList.remove("drag-over"));

            // 执行插入操作而不是交换
            if (targetIndex !== draggingItemIndex && targetIndex !== draggingItemIndex + 1) {
              const entry = DATA[currentIndex];
              if (entry && entry.items) {
                // 删除原来的项
                const [item] = entry.items.splice(draggingItemIndex, 1);
                
                // 计算新的插入位置（因为已经删除了一个元素）
                let insertIndex = targetIndex;
                if (targetIndex > draggingItemIndex) {
                  insertIndex = targetIndex - 1;
                }
                
                // 插入到新位置
                entry.items.splice(insertIndex, 0, item);
                renderEditingMode(entry);
              }
            }

            draggingItem = null;
            draggingItemIndex = -1;
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
          }

          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onMouseUp);
        });
      });
    }

    /**
     * 渲染编辑模式下的列表项
     */
    function renderEditingMode(entry) {
      const itemsContainer = document.querySelector(".items");
      if (!itemsContainer) return;

      itemsContainer.innerHTML = entry.items.map((item, index) => `
        <div class="item editable">
          <div class="drag-handle">≡</div>
          <input type="text" class="item-input" value="${escapeHtml(item)}" data-index="${index}" />
          <button class="delete-btn" data-index="${index}">×</button>
        </div>
      `).join("");

      // 绑定删除事件
      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const index = Number(e.target.dataset.index);
          entry.items.splice(index, 1);
          renderEditingMode(entry);
        });
      });

      // 绑定编辑事件
      document.querySelectorAll(".item-input").forEach(input => {
        input.addEventListener("change", (e) => {
          const index = Number(e.target.dataset.index);
          entry.items[index] = e.target.value || "未命名";
        });

        input.addEventListener("input", (e) => {
          const index = Number(e.target.dataset.index);
          entry.items[index] = e.target.value || "未命名";
        });
      });

      // 设置拖动排序
      setupDragAndDrop();
    }

    /**
     * 渲染“列表抽取”模式的面板内容。
     * @param {Object} entry 当前模式数据
     */
    function renderListPanel(entry) {
      if (isEditingMode) {
        panelBody.innerHTML = `
          ${renderResultBox()}
          <div class="toolbar">
            <button class="primary" id="saveBtn">保存</button>
            <button class="primary" style="background: #dc2626;" id="cancelBtn">取消</button>
            <button class="primary" style="background: #16a34a;" id="addBtn">+ 添加项目</button>
          </div>
          <div class="items"></div>
        `;

        renderEditingMode(entry);

        // 添加项目
        document.getElementById("addBtn").addEventListener("click", () => {
          entry.items.push("新项目");
          renderEditingMode(entry);
        });

        // 保存
        document.getElementById("saveBtn").addEventListener("click", () => {
          isEditingMode = false;
          editingBackup = null;
          saveToStorage();
          render();
        });

        // 取消
        document.getElementById("cancelBtn").addEventListener("click", () => {
          if (editingBackup) {
            entry.items = [...editingBackup];
          }
          isEditingMode = false;
          editingBackup = null;
          render();
        });

        // 禁用开始抽取按钮（虽然不显示）
        setResult("编辑中...");
      } else {
        panelBody.innerHTML = `
          ${renderResultBox()}
          <div class="toolbar">
            <button class="primary" id="drawListBtn">开始抽取</button>
            <button class="primary" style="background: #0891b2;" id="editBtn">编辑</button>
          </div>
          <div class="items">
            ${entry.items.map(item => `<div class="item">${escapeHtml(item)}</div>`).join("")}
          </div>
        `;

        document.getElementById("drawListBtn").addEventListener("click", () => {
          const item = pickOne(entry.items);
          setResult(item ?? "当前列表为空");
        });

        document.getElementById("editBtn").addEventListener("click", () => {
          isEditingMode = true;
          editingBackup = [...entry.items];
          renderPanel();
        });
      }
    }

    /**
     * 渲染“分组抽取”模式面板，并显示每个分组及其项目。
     * @param {Object} entry 当前模式数据
     */
    function renderGroupsPanel(entry) {
      const groupHtml = Object.entries(entry.groups).map(([groupName, groupData]) => renderGroup(groupName, groupData)).join("");

      panelBody.innerHTML = `
        ${renderResultBox()}
        <div class="toolbar">
          <button class="primary" id="drawGroupBtn">开始抽取</button>
        </div>
        ${groupHtml}
      `;

      document.getElementById("drawGroupBtn").addEventListener("click", () => {
        const result = pickFromNestedGroup(entry.groups);
        setResult(result ?? "没有可抽取的内容");
      });
    }

    /**
     * 渲染“数字抽取”模式面板，支持自定义最小值和最大值。
     * @param {Object} entry 当前模式数据
     */
    function renderNumberPanel(entry) {
      panelBody.innerHTML = `
        ${renderResultBox("抽取结果")}
        <div class="toolbar">
          <button class="primary" id="drawNumberBtn">开始抽取</button>
        </div>
        <div class="range-box">
          <label>从 <input type="number" id="minNumber" value="${escapeHtml(entry.min)}" step="1" /></label>
          <label>到 <input type="number" id="maxNumber" value="${escapeHtml(entry.max)}" step="1" /></label>
        </div>
      `;

      document.getElementById("drawNumberBtn").addEventListener("click", () => {
        const minInput = document.getElementById("minNumber");
        const maxInput = document.getElementById("maxNumber");
        let min = Number.parseInt(minInput.value, 10);
        let max = Number.parseInt(maxInput.value, 10);

        if (Number.isNaN(min) || Number.isNaN(max)) {
          setResult("请输入有效整数");
          return;
        }

        if (min > max) {
          [min, max] = [max, min];
        }

        setResult(String(randomInt(min, max)));
      });
    }

    /**
     * 根据当前选中的模式渲染右侧面板内容。
     */
    function renderPanel() {
      const entry = DATA[currentIndex];

      if (!entry) {
        panelHeader.textContent = "当前内容";
        panelBody.innerHTML = '<div class="error">没有可用内容。</div>';
        return;
      }

      panelHeader.textContent = entry.title;

      if (entry.type === "list") {
        renderListPanel(entry);
        return;
      }

      if (entry.type === "groups") {
        renderGroupsPanel(entry);
        return;
      }

      if (entry.type === "number") {
        renderNumberPanel(entry);
        return;
      }

      panelBody.innerHTML = '<div class="error">格式不正确。</div>';
    }

    /**
     * 重新渲染导航与当前内容面板。
     */
    function render() {
      renderNav();
      renderPanel();
    }

    // 页面初始化入口
    loadFromStorage();
    render();
  </script>
</body>
</html>
